# Build both instance lines and push them to GHCR.
# Tags: ghcr.io/<owner>/comfyfleet-images:cu130 and :cu124, plus <sha>-<tag>.
# No GPU: neither instance Dockerfile imports comfy_kitchen during the build.
# Torch wheels are large. The job frees disk first and allows 180 minutes.
# If the runner still runs out of disk or time, use scripts/publish-images.sh.
# No path filter. A push that replaces history has no common ancestor, and
# GitHub then skips a paths filter instead of starting this run.
name: Publish images

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-ghcr-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  instance:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_tag: cu130
            dockerfile: Dockerfile
          - cuda_tag: cu124
            dockerfile: Dockerfile.cu124
    steps:
      - name: Free runner disk
        run: |
          set -eux
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/share/chromium \
            /opt/hostedtoolcache \
            || true
          sudo apt-get clean
          docker builder prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: names
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/comfyfleet-images" >> "${GITHUB_OUTPUT}"

      - name: Instance tags
        id: tags
        run: |
          image="${{ steps.names.outputs.image }}"
          cuda_tag="${{ matrix.cuda_tag }}"
          {
            echo "list<<EOF"
            echo "${image}:${cuda_tag}"
            echo "${image}:${GITHUB_SHA}-${cuda_tag}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push instance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.recognizeyourprivilege.comfyfleet.cuda-tag=${{ matrix.cuda_tag }}

      - name: Digest
        run: echo "instance-${{ matrix.cuda_tag }} ${{ steps.names.outputs.image }}:${{ matrix.cuda_tag }}@${{ steps.build.outputs.digest }}"
